{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}

<div class="card home-card">
    <h1>Welcome {{ user.full_name }}!</h1>

    <p>
        To logout click
        <a href="{% url 'logout' %}" class="logout-link">here</a>
    </p>

    <form method="post" action="{% url 'deactivate' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Deactivate my account</button>
    </form>
</div>

{% endblock %}
