services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-auth_challenge}
      POSTGRES_USER: ${DB_USER:-django}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - ./app/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-django} -d $${DB_NAME:-auth_challenge}"]
      interval: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/app
    ports:
      - "127.0.0.1:8003:8000"
    env_file:
      - ./app/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
